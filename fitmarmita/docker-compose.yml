services:
  postgres:
    image: postgres:16-alpine
    container_name: fitmarmita-db
    environment:
      POSTGRES_DB: fitmarmita
      POSTGRES_USER: fitmarmita
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmarmita"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

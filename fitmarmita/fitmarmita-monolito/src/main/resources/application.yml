server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fitmarmita-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      # optional: acima ja garante que a app sobe mesmo se o config-server
      # estiver fora do ar (usando so os defaults locais deste arquivo).
      fail-fast: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitmarmita}
    username: ${DB_USER:fitmarmita}
    password: ${DB_PASSWORD:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

fitmarmita:
  jwt:
    secret: ${JWT_SECRET:8ZBa6ay+cxEgrTszI2cVzNF9ANMWw97QNlc8p6vJleuW8+sKBA0Pz3DKHAhbgKSli+jb/NNLsJub1itkZwqH2w==}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:24}
  login:
    max-tentativas: ${LOGIN_MAX_TENTATIVAS:5}
    minutos-bloqueio: ${LOGIN_MINUTOS_BLOQUEIO:15}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: fitmarmita-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitmarmita}
    username: ${DB_USER:fitmarmita}
    password: ${DB_PASSWORD:dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

fitmarmita:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-com-no-minimo-32-caracteres-para-hmac-sha-funcionar}
    expiration-hours: 24
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.fitmarmita: DEBUG
